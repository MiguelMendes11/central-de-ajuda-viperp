<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Novo Artigo | Central de Ajuda VipERP</title>

  <link rel="icon" type="image/png" href="../assets/favicon.png" />
  <link rel="stylesheet" href="./css/admin.css?v=3" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />
</head>
<body class="admin-panel-page">
  <header class="admin-topbar">
    <div class="admin-topbar-content">
      <a href="./index.html" class="admin-brand">
        <img src="../assets/logo-viperp.png" alt="VipERP" />
        <span>Central de Ajuda</span>
      </a>

      <nav class="admin-nav">
        <a href="./index.html" class="active">
          <span class="admin-nav-icon">📄</span>
          Artigos
        </a>

        <button type="button" class="admin-nav-disabled" disabled>
          <span class="admin-nav-icon">📁</span>
          Categorias
        </button>

        <button type="button" class="admin-nav-disabled" disabled>
          <span class="admin-nav-icon">🏷️</span>
          Tags
        </button>

        <button type="button" class="admin-nav-disabled" disabled>
          <span class="admin-nav-icon">🖼️</span>
          Mídias
        </button>

        <button type="button" class="admin-nav-disabled" disabled>
          <span class="admin-nav-icon">⚙️</span>
          Configurações
        </button>

        <a href="../index.html" target="_blank" rel="noopener noreferrer">
          <span class="admin-nav-icon">↗</span>
          Ver site
        </a>

        <button type="button" id="logoutButton" class="admin-nav-logout">
          <span class="admin-nav-icon">⎋</span>
          Sair
        </button>
      </nav>
    </div>
  </header>

  <main class="admin-main">
    <section class="admin-hero admin-hero-compact">
      <div>
        <span class="admin-pill">Novo artigo</span>

        <h1>Criar artigo</h1>

        <p>
          Cadastre um novo conteúdo para a Central de Ajuda VipERP.
        </p>
      </div>

      <a href="./index.html" class="btn-admin-secondary" id="backToArticlesButton">
        ← Voltar
      </a>
    </section>

    <section class="admin-edit-layout">
      <form class="admin-edit-card" id="articleCreateForm">
        <div class="admin-form-grid">
          <div class="admin-form-group">
            <label for="articleTitle">Título</label>
            <input
              type="text"
              id="articleTitle"
              name="title"
              placeholder="Digite o título do artigo"
              required
            />
          </div>

          <div class="admin-form-group">
            <label for="articleSlug">Slug</label>
            <input
              type="text"
              id="articleSlug"
              name="slug"
              placeholder="slug-do-artigo"
              required
            />
          </div>

          <div class="admin-form-group">
            <label for="articleCategory">Categoria</label>
            <select id="articleCategory" name="categoryId">
              <option value="">Carregando categorias...</option>
            </select>
          </div>

          <div class="admin-form-group">
            <label for="articleStatus">Status</label>
            <select id="articleStatus" name="status" required>
              <option value="DRAFT">Rascunho</option>
              <option value="PUBLISHED">Publicado</option>
              <option value="ARCHIVED">Arquivado</option>
            </select>
          </div>

          <div class="admin-form-group">
            <label for="articleProtected">Protegido</label>
            <select id="articleProtected" name="protected" required>
              <option value="false">Não</option>
              <option value="true">Sim</option>
            </select>
          </div>

          <div class="admin-form-group">
            <label for="articleFeatured">Destacado</label>
            <select id="articleFeatured" name="isFeatured" required>
              <option value="false">Não</option>
              <option value="true">Sim</option>
            </select>
          </div>
        </div>

        <div class="admin-form-group">
          <label for="articleSummary">Resumo</label>
          <textarea
            id="articleSummary"
            name="summary"
            rows="4"
            placeholder="Resumo curto do artigo"
          ></textarea>
        </div>

        <div class="admin-form-group">
          <label for="articleContent">Conteúdo HTML</label>
          <textarea
            id="articleContent"
            name="contentHtml"
            rows="18"
            placeholder="Digite o conteúdo HTML do artigo"
            required
          ></textarea>
        </div>

        <div class="admin-edit-actions">
          <button type="button" class="btn-admin-secondary" id="cancelCreateButton">
            Cancelar
          </button>

          <button type="submit" class="btn-admin-primary" id="createArticleButton">
            Criar artigo
          </button>
        </div>

        <p class="admin-edit-message info" id="articleCreateMessage">
          Preencha os dados do novo artigo. Por segurança, ele inicia como rascunho.
        </p>
      </form>
    </section>
  </main>

  <script src="./js/novo-artigo.js?v=2"></script>
</body>
</html>
